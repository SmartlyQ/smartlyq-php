name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Lint
        run: |
          set -e
          find src scripts -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "All PHP files lint clean."

      - name: Run tests
        run: vendor/bin/phpunit
